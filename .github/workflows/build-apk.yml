name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract and patch Android source
        run: |
          unzip -oq degoogled-dialer-app-v5.zip -d source
          # Correct the invalid Gradle RepositoriesMode enum used in the source archive.
          find source -type f -name '*.gradle.kts' -exec sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOSITORIES/RepositoriesMode.FAIL_ON_PROJECT_REPOS/g' {} +
          # Enable AndroidX for the AndroidX dependencies used by the app.
          if [ -f source/gradle.properties ]; then
            grep -q '^android.useAndroidX=' source/gradle.properties && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' source/gradle.properties || echo 'android.useAndroidX=true' >> source/gradle.properties
            grep -q '^android.enableJetifier=' source/gradle.properties || echo 'android.enableJetifier=true' >> source/gradle.properties
          else
            printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > source/gradle.properties
          fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Use Android SDK installed on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
      - name: Build debug APK
        shell: bash
        run: |
          set -e
          wrapper="$(find source -type f -name gradlew -print -quit)"
          if [ -n "$wrapper" ]; then
            project_dir="$(dirname "$wrapper")"
            cd "$project_dir"
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            build_file="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [ -z "$build_file" ]; then
              echo "No Gradle build files found in degoogled-dialer-app-v5.zip"
              exit 1
            fi
            cd "$(dirname "$build_file")"
            gradle --no-daemon assembleDebug
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DegoogledDialer-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
