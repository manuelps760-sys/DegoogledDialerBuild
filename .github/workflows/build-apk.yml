name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract and patch Android source
        run: |
          unzip -oq degoogled-dialer-app-v5.zip -d source
          # Fix Kotlin compile errors in the supplied source archive.
          sed -i 's/sipClient?.startClient(server, user, pass, SipDebugManager.pcapEnabled, SipDebugManager.tlsEnabled)/sipClient?.startClient(server, user, pass, SipDebugManager.pcapEnabled)/' source/app/src/main/java/org/degoogled/dialer/MainActivity.kt
          sed -i 's/# Default SIPS over TLS/\/\/ Default SIPS over TLS/' source/app/src/main/java/org/degoogled/dialer/SipDebugManager.kt
          sed -i 's/# Default Secure RTP payload encryption/\/\/ Default Secure RTP payload encryption/' source/app/src/main/java/org/degoogled/dialer/SipDebugManager.kt
          # Apply functional and privacy fixes to the uploaded source before compiling.
          python3 - <<'PY'
          from pathlib import Path
          base = Path("source/app/src/main/java/org/degoogled/dialer")
          p = base / "SipDebugManager.kt"
          s = p.read_text()
          s = s.replace("var pcapEnabled: Boolean = true", "var pcapEnabled: Boolean = false")
          p.write_text(s)

          p = base / "sip/SipClient.kt"
          s = p.read_text()
          s = s.replace('var sipServer: String = "192.168.1.100"', 'var sipServer: String = ""')
          s = s.replace('var sipUser: String = "101"', 'var sipUser: String = ""')
          s = s.replace('var sipPass: String = "secret123"', 'var sipPass: String = ""')
          s = s.replace('''    private fun getLocalIpAddress(): String {
                  return "127.0.0.1"
              }''', '''    private fun getLocalIpAddress(): String {
                  // Never advertise loopback to a remote SIP server. Choose an active non-loopback IPv4.
                  return try {
                      java.net.NetworkInterface.getNetworkInterfaces().toList()
                          .asSequence()
                          .filter { it.isUp && !it.isLoopback }
                          .flatMap { it.inetAddresses.toList().asSequence() }
                          .filterIsInstance<java.net.Inet4Address>()
                          .map { it.hostAddress }
                          .firstOrNull { !it.isNullOrBlank() }
                          ?: "0.0.0.0"
                  } catch (_: Exception) {
                      "0.0.0.0"
                  }
              }''')
          p.write_text(s)

          p = base / "MainActivity.kt"
          s = p.read_text()
          s = s.replace('''            val server = etSipServer.text.toString()
                      val user = etSipUser.text.toString()
                      val pass = etSipPass.text.toString()

                      sipClient?.startClient(server, user, pass, SipDebugManager.pcapEnabled)''', '''            val server = etSipServer.text.toString().trim()
                      val user = etSipUser.text.toString().trim()
                      val pass = etSipPass.text.toString()

                      if (server.isBlank() || user.isBlank() || pass.isBlank()) {
                          Toast.makeText(this, "Enter your SIP server, username, and password first.", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }
                      sipClient?.startClient(server, user, pass, SipDebugManager.pcapEnabled)''')
          s = s.replace('''            Toast.makeText(this, "IMEI: 869403049182301 / 869403049182302", Toast.LENGTH_LONG).show()''',
                        '''            Toast.makeText(this, "For device identifiers, open Android Settings → About phone. This app does not invent or expose IMEI values.", Toast.LENGTH_LONG).show()''')
          p.write_text(s)
          PY
          # Correct the invalid Gradle RepositoriesMode enum used in the source archive.
          find source -type f -name '*.gradle.kts' -exec sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOSITORIES/RepositoriesMode.FAIL_ON_PROJECT_REPOS/g' {} +
          # Enable AndroidX for the AndroidX dependencies used by the app.
          if [ -f source/gradle.properties ]; then
            grep -q '^android.useAndroidX=' source/gradle.properties && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' source/gradle.properties || echo 'android.useAndroidX=true' >> source/gradle.properties
            grep -q '^android.enableJetifier=' source/gradle.properties || echo 'android.enableJetifier=true' >> source/gradle.properties
          else
            printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > source/gradle.properties
          fi
          # Supply minimal resources referenced by the manifest if the archive omitted them.
          appdir="$(find source -type f -name AndroidManifest.xml -path '*/app/src/main/*' -print -quit | sed 's#/src/main/AndroidManifest.xml##')"
          if [ -n "$appdir" ]; then
            res="$appdir/src/main/res"
            mkdir -p "$res/mipmap-anydpi" "$res/values"
            if ! find "$res" -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher.xml' -o -name 'ic_launcher.webp' \) | grep -q .; then
              cat > "$res/mipmap-anydpi/ic_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#2457C5" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M15,7h18a3,3 0,0 1,3 3v28a3,3 0,0 1,-3 3h-18a3,3 0,0 1,-3 -3v-28a3,3 0,0 1,3 -3z M17,12v24h14v-24z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M20,17h8v3h-8z M20,23h8v3h-8z M20,29h8v3h-8z"/>
          </vector>
          XML
            fi
            if ! grep -Rqs 'name="AppTheme"' "$res/values" 2>/dev/null; then
              cat > "$res/values/styles.xml" <<'XML'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#2457C5</item>
                  <item name="colorPrimaryVariant">#163A8A</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#03DAC5</item>
              </style>
          </resources>
          XML
            fi
          fi
          # Add color resources referenced by layouts if the source archive omitted them.
          if [ -n "$appdir" ]; then
            mkdir -p "$appdir/src/main/res/values"
            cat > "$appdir/src/main/res/values/build-fallback-colors.xml" <<'XML'
          <resources>
              <color name="white">#FFFFFFFF</color>
              <color name="call_green">#FF2EAD62</color>
          </resources>
          XML
          fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Use Android SDK installed on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
      - name: Build debug APK
        shell: bash
        run: |
          set -e
          wrapper="$(find source -type f -name gradlew -print -quit)"
          if [ -n "$wrapper" ]; then
            project_dir="$(dirname "$wrapper")"
            cd "$project_dir"
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            build_file="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [ -z "$build_file" ]; then
              echo "No Gradle build files found in degoogled-dialer-app-v5.zip"
              exit 1
            fi
            cd "$(dirname "$build_file")"
            gradle --no-daemon assembleDebug
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DegoogledDialer-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
