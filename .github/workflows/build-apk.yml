name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android source ZIP
        run: unzip -oq degoogled-dialer-app-v5.zip -d source

      - name: Patch and validate source
        run: |
          python3 .github/scripts/patch_android_source.py source
          python3 .github/scripts/complete_dialer.py source
          python3 .github/scripts/repair_call_features.py source
          find source -type f -name '*.gradle.kts' -exec sed -i 's/RepositoriesMode\.FAIL_ON_PROJECT_REPOSITORIES/RepositoriesMode.FAIL_ON_PROJECT_REPOS/g' {} +
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > source/gradle.properties
          appdir=source/app
          mkdir -p "$appdir/src/main/res/values" "$appdir/src/main/res/mipmap-anydpi"
          cat > "$appdir/src/main/res/values/build-fallback-colors.xml" <<'XML'
          <resources>
              <color name="white">#FFFFFFFF</color>
              <color name="call_green">#FF2EAD62</color>
          </resources>
          XML
          if ! grep -Rqs 'name="AppTheme"' "$appdir/src/main/res/values"; then
            cat > "$appdir/src/main/res/values/build-fallback-styles.xml" <<'XML'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#2457C5</item>
                  <item name="colorPrimaryVariant">#163A8A</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#03DAC5</item>
              </style>
          </resources>
          XML
          fi
          if ! find "$appdir/src/main/res" -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher.xml' -o -name 'ic_launcher.webp' \) | grep -q .; then
            cat > "$appdir/src/main/res/mipmap-anydpi/ic_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#2457C5" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M15,7h18a3,3 0,0 1,3 3v28a3,3 0,0 1,-3 3h-18a3,3 0,0 1,-3 -3v-28a3,3 0,0 1,3 -3z M17,12v24h14v-24z"/>
          </vector>
          XML
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: |
          cd source
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DegoogledDialer-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
